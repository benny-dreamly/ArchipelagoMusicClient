name: Build and Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build_jar.yml

  # jpackage cannot cross-compile, so each OS builds its own bundle. The
  # resulting .app (macOS), .exe app-image (Windows), and Linux app are
  # zipped and attached to the draft release.
  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle_name: macos-arm64
          - os: windows-latest
            bundle_name: windows-x64
          - os: ubuntu-latest
            bundle_name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 25

      - name: Strip leading v from version
        id: version
        shell: bash
        run: |
          ver="${{ github.event.inputs.version || github.ref_name }}"
          echo "version_no_v=${ver#v}" >> $GITHUB_OUTPUT

      - name: Build packaged app (jpackage)
        shell: bash
        run: bash ./gradlew packageApp -PappVersion=${{ steps.version.outputs.version_no_v }}

      - name: Zip the bundle
        shell: bash
        run: |
          set -euo pipefail
          cd build/pkg
          dir=$(ls -1 | head -n 1)
          mkdir -p ../../dist
          jar --create --file "../../dist/ArchipelagoMusicClient-${{ steps.version.outputs.version_no_v }}-${{ matrix.bundle_name }}.zip" "$dir"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-${{ matrix.bundle_name }}
          path: dist/*.zip

  create-release:
    needs: [build, package]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'MusicPlayer-*'
          path: ./artifacts

      - name: Strip leading v from version
        id: strip_v
        run: |
          ver="${{ github.event.inputs.version || github.ref_name }}"
          echo "version_no_v=${ver#v}" >> $GITHUB_OUTPUT

      - name: Detect JAR and extract version
        id: jarinfo
        run: |
          file=$(ls artifacts/MusicPlayer-JAR/*.jar | head -n 1)
          echo "jar_file=$file" >> $GITHUB_OUTPUT

          # Extract version between the first '-' and '-all'
          # Example: ArchipelagoMusicClient-3.0-all.jar → 3.0
          version=$(basename "$file" | sed -E 's/^.*-([0-9]+\.[0-9]+.*)-all\.jar$/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Archipelago Music Client Version ${{ steps.strip_v.outputs.version_no_v }}
          body: |
            ## Changes
            - Auto-generated release from build workflow

            To run the cross-platform jar:

            ```
            java -jar ArchipelagoMusicClient-${{ steps.jarinfo.outputs.version }}-all.jar
            ```

            Pre-packaged apps for this version are attached:
            - macOS: `ArchipelagoMusicClient-${{ steps.strip_v.outputs.version_no_v }}-macos-arm64.zip` (drag the `.app` to Applications)
            - Windows: `ArchipelagoMusicClient-${{ steps.strip_v.outputs.version_no_v }}-windows-x64.zip`
            - Linux: `ArchipelagoMusicClient-${{ steps.strip_v.outputs.version_no_v }}-linux-x64.zip`

            Note: the macOS bundle is unsigned, so Gatekeeper may warn the first time it opens.
          draft: true
          files: |
            ./artifacts/MusicPlayer-JAR/*.jar
            ./artifacts/MusicPlayer-macos-arm64/*.zip
            ./artifacts/MusicPlayer-windows-x64/*.zip
            ./artifacts/MusicPlayer-linux-x64/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}